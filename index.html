<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nikah Invitation — Fariha Ahammed & Arib Abrar Nasif</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-ivory: #f8f5ef;
      --bg-pearl: #fdfbf7;
      --card-white: #ffffff;
      --gold-primary: #c5a059;
      --gold-light: #e4cfa3;
      --gold-dark: #9c7935;
      --burgundy: #5e1928;
      --burgundy-hover: #47111d;
      --text-dark: #2c241d;
      --text-muted: #6c6156;
      --border-gold: rgba(197, 160, 89, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-ivory);
      color: var(--text-dark);
      overflow-x: hidden;
      min-height: 100vh;
    }

    .serif {
      font-family: 'Cormorant Garamond', Georgia, serif;
    }

    .arabic {
      font-family: 'Amiri', serif;
      direction: rtl;
    }

    /* ================= COVER SCREEN (PAGE 1 - NO SCROLL) ================= */
    #cover-screen {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #fdfbf7 0%, #efe8da 100%);
      perspective: 1600px;
      overflow: hidden;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    #cover-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .cover-stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
    }

    .curtain-panel {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 50%;
      background: linear-gradient(135deg, #f9f6f0 0%, #ede5d5 50%, #f5efe4 100%);
      box-shadow: inset 0 0 60px rgba(156, 121, 53, 0.08);
      transition: transform 1.35s cubic-bezier(0.77, 0, 0.175, 1);
      z-index: 2;
    }

    .curtain-panel::before {
      content: "";
      position: absolute;
      inset: 16px;
      border: 1px solid rgba(197, 160, 89, 0.4);
      pointer-events: none;
    }

    .curtain-left {
      left: 0;
      transform-origin: left center;
      border-right: 1px solid rgba(197, 160, 89, 0.5);
    }

    .curtain-left::before {
      border-right: none;
      border-radius: 16px 0 0 16px;
    }

    .curtain-right {
      right: 0;
      transform-origin: right center;
      border-left: 1px solid rgba(197, 160, 89, 0.5);
    }

    .curtain-right::before {
      border-left: none;
      border-radius: 0 16px 16px 0;
    }

    #cover-screen.opening .curtain-left {
      transform: rotateY(-105deg) translateX(-12%);
    }

    #cover-screen.opening .curtain-right {
      transform: rotateY(105deg) translateX(12%);
    }

    .skip-btn {
      position: absolute;
      top: 26px;
      right: 26px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid var(--border-gold);
      color: var(--gold-dark);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.16em;
      padding: 8px 16px;
      border-radius: 999px;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: all 0.25s ease;
    }

    .skip-btn:hover {
      background: #ffffff;
      transform: translateY(-1px);
    }

    .cover-center-ui {
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    #cover-screen.opening .cover-center-ui {
      opacity: 0;
      transform: scale(0.92);
    }

    .crest-wrapper {
      position: relative;
      width: 148px;
      height: 148px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .crest-halo {
      position: absolute;
      inset: -14px;
      border-radius: 50%;
      border: 1px solid rgba(197, 160, 89, 0.45);
      animation: pulseHalo 3s infinite ease-in-out;
    }

    .crest-halo-outer {
      position: absolute;
      inset: -28px;
      border-radius: 50%;
      border: 1px dashed rgba(197, 160, 89, 0.35);
      animation: spinSlow 28s linear infinite;
    }

    @keyframes pulseHalo {
      0%, 100% { transform: scale(0.96); opacity: 0.55; }
      50% { transform: scale(1.06); opacity: 1; }
    }

    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .crest-medallion {
      width: 132px;
      height: 132px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffffff 0%, #f7f1e3 100%);
      border: 4px solid var(--gold-primary);
      box-shadow: 0 12px 32px rgba(156, 121, 53, 0.22), inset 0 0 0 3px #fff, inset 0 0 0 5px var(--gold-light);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .crest-initials {
      font-family: 'Cormorant Garamond', serif;
      font-size: 36px;
      font-style: italic;
      font-weight: 700;
      color: var(--gold-dark);
      letter-spacing: 2px;
    }

    .open-btn {
      background: linear-gradient(135deg, #d7b672 0%, #b99144 100%);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.5);
      padding: 14px 28px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.16em;
      cursor: pointer;
      box-shadow: 0 10px 26px rgba(156, 121, 53, 0.32);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .open-btn:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 14px 32px rgba(156, 121, 53, 0.42);
    }

    /* ================= MAIN PAGE (PAGE 2 - SCROLLABLE) ================= */
    #main-invitation {
      display: none;
      opacity: 0;
      transition: opacity 0.9s ease;
    }

    #main-invitation.visible {
      display: block;
      opacity: 1;
    }

    /* Sticky Navbar */
    .top-nav {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(253, 251, 247, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-gold);
      padding: 12px 20px;
    }

    .nav-inner {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px;
      font-weight: 600;
      color: var(--text-dark);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-pill {
      background: #ffffff;
      border: 1px solid var(--border-gold);
      color: var(--gold-dark);
      font-size: 11px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .nav-pill:hover {
      background: var(--bg-ivory);
    }

    /* Hero Pavilion Section */
    .hero-section {
      position: relative;
      padding: 28px 18px 46px;
      background: linear-gradient(180deg, #f3ede0 0%, #fbf8f2 65%, #f8f5ef 100%);
      overflow: hidden;
      text-align: center;
    }

    .arch-backdrop {
      max-width: 640px;
      margin: 0 auto;
      position: relative;
    }

    .chandelier-svg {
      width: 110px;
      height: 125px;
      margin: 0 auto -12px;
      display: block;
      transform-origin: top center;
      animation: swayChandelier 5.5s ease-in-out infinite;
    }

    @keyframes swayChandelier {
      0%, 100% { transform: rotate(-2deg); }
      50% { transform: rotate(2deg); }
    }

    /* Double-bordered Luxury Card */
    .luxury-card {
      background: var(--card-white);
      border-radius: 24px;
      padding: 8px;
      box-shadow: 0 18px 45px rgba(44, 36, 29, 0.06);
      border: 1px solid rgba(197, 160, 89, 0.35);
      max-width: 580px;
      margin: 0 auto;
      position: relative;
    }

    .luxury-card-inner {
      border: 1.5px solid var(--border-gold);
      border-radius: 18px;
      padding: 32px 22px;
      position: relative;
      background: linear-gradient(180deg, #ffffff 0%, #fdfbf7 100%);
    }

    .corner-ornament {
      position: absolute;
      width: 24px;
      height: 24px;
      color: var(--gold-primary);
      opacity: 0.75;
    }
    .corner-tl { top: 10px; left: 10px; }
    .corner-tr { top: 10px; right: 10px; transform: scaleX(-1); }
    .corner-bl { bottom: 10px; left: 10px; transform: scaleY(-1); }
    .corner-br { bottom: 10px; right: 10px; transform: scale(-1); }

    .hero-kicker {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.22em;
      color: var(--gold-dark);
      margin-bottom: 16px;
      text-transform: uppercase;
    }

    .couple-hero-names {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(32px, 6vw, 44px);
      font-weight: 700;
      color: var(--text-dark);
      line-height: 1.15;
    }

    .hero-amp {
      font-family: 'Cormorant Garamond', serif;
      font-size: 24px;
      font-style: italic;
      color: var(--gold-primary);
      margin: 6px 0;
    }

    .arabic-pill-box {
      margin: 22px auto 24px;
      background: #faf7f0;
      border: 1px solid rgba(197, 160, 89, 0.3);
      border-radius: 14px;
      padding: 12px 18px;
